name: CI - Validatie & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ===================================================================
# Deze pipeline VALIDEERT en TEST de code bij elke push (feedbackloop).
# De daadwerkelijke deployment gebeurt gecontroleerd via 'terraform
# apply' (zie README) omdat de Terraform-state niet in Git staat en
# dus niet gedeeld wordt met de CI-runner. Dit is bewuste best practice:
# CI test, deploy gebeurt apart en gecontroleerd.
# ===================================================================

jobs:
  validate:
    runs-on: [self-hosted, hybrid]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform validate (azure)
        run: |
          cd terraform/azure
          terraform init -backend=false -input=false
          terraform validate

      - name: Terraform validate (esxi)
        run: |
          cd terraform/esxi
          terraform init -backend=false -input=false
          terraform validate

      - name: Installeer Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Ansible syntax check
        run: |
          cd ansible
          ansible-playbook playbook.yml --syntax-check -i esxi_inventory.ini
          ansible-playbook hybrid_test.yml --syntax-check -i esxi_inventory.ini