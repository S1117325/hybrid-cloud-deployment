name: Hybrid Cloud Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

# ===================================================================
# LET OP: deze workflow draait nu de ESXi-kant (werkt volledig).
# De Azure-kant + hybrid test zet je aan zodra je een werkende
# Azure subscription hebt.
# ===================================================================

jobs:
  deploy-esxi:
    runs-on: [self-hosted, hybrid]
    env:
      TF_VAR_esxi_password: ${{ secrets.ESXI_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zet SSH keys klaar
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_SKYLAB_PRIVATE }}" > ~/.ssh/skylab
          echo "${{ secrets.SSH_AZURE_PRIVATE }}"  > ~/.ssh/azure
          chmod 600 ~/.ssh/skylab ~/.ssh/azure

      - name: Installeer Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Terraform validate (esxi)
        run: |
          cd terraform/esxi
          terraform init -input=false
          terraform validate

      - name: Ansible syntax check
        run: |
          cd ansible
          ansible-playbook playbook.yml --syntax-check -i esxi_inventory.ini

      - name: Deploy ESXi
        run: |
          cd terraform/esxi
          terraform apply -auto-approve -input=false